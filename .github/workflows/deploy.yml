name: Deploy to Pages Branch

on:
  # 每次推送到 `master` 分支时触发这个"工作流程"
  push:
    branches: [ master ]
  # 允许你在 GitHub 上的 Actions 标签中手动触发此"工作流程"
  workflow_dispatch:

# 需要写入权限来推送到pages分支
permissions:
  contents: write

jobs:
  # 质量门禁：以可复用工作流方式直接调用 lint.yml（biome / typecheck / 单测 / 构建），
  # 避免步骤复制漂移。build-and-deploy 通过 `needs` 依赖此任务，
  # 任一检查失败都会使部署任务被跳过。
  quality-gate:
    name: Quality Gate
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  build-and-deploy:
    needs: quality-gate  # 门禁未通过则不执行构建与部署
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true  # 支持 Git Submodule 模式
          token: ${{ secrets.GITHUB_TOKEN }}  # 自动访问同账号下的私有仓库
          lfs: true  # 拉取 LFS 管理的 Live2D 模型二进制

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"  # 当前 LTS，避免已弃用的 Node 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 以下把原来一整条 `pnpm run build` 拆成独立步骤，
      # 这样哪一步失败会在 Actions 列表里直接显示红色 ❌，便于定位。

      - name: Sync keystatic config
        run: node scripts/sync-keystatic.mjs

      - name: Update anime data
        run: node scripts/update-anime.mjs

      - name: Astro build (static for Pages)
        run: pnpm exec astro build
        env:
          # 纯静态构建（不带 SSR adapter / keystatic 管理后台），
          # 产出带根 index.html 的 dist/，适配 GitHub Pages。
          DEPLOY_TARGET: pages

      - name: Build search index (pagefind)
        run: pnpm exec pagefind --site dist

      - name: Compress fonts
        run: node scripts/compress-fonts/index.js

      - name: Deploy to pages branch
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4
        with:
          branch: pages # 部署到pages分支
          folder: dist # Astro默认构建输出目录
          clean: true # 清理目标分支中的旧文件
