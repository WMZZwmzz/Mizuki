name: Lint

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  # 供 deploy.yml 的 quality-gate 以可复用工作流方式调用，消除门禁步骤复制漂移
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  biome:
    name: Biome Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"  # 与 deploy.yml 对齐；项目 pnpm/node:sqlite 要求 Node 22

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome Check
        # 只读检查（不带 --write），避免 CI 中改写文件
        run: pnpm lint:ci

      - name: Check CSS !important
        # docs/rule/04-css-style-guide.md 的机械化门禁：src/ 样式文件禁止新增
        # !important（twikoo 文件豁免，存量记录在 scripts/check-important.baseline.json）
        run: pnpm check:important

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"  # 与 deploy.yml 对齐；项目 pnpm/node:sqlite 要求 Node 22

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Astro Check
        run: pnpm astro check
        env:
          ENABLE_CONTENT_SYNC: false

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"  # 与 deploy.yml 对齐；项目 pnpm/node:sqlite 要求 Node 22

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Unit Tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"  # 与 deploy.yml 对齐；项目 pnpm/node:sqlite 要求 Node 22

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # 用项目标准 `pnpm build` 构建纯静态产物（DEPLOY_TARGET=pages，与
        # deploy.yml 一致）。此前 CI 失败的根因是 poster-image.ts 的图片 glob
        # 误匹配了 public/pio/models 下 Git-LFS 跟踪的纹理（未开 lfs 的检出里
        # 是指针文本），已在 poster-image.ts 排除 public/ 修复。
        run: pnpm build
        env:
          ENABLE_CONTENT_SYNC: false
          DEPLOY_TARGET: pages
